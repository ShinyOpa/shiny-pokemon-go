<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex GO – achtergrondencatalogus</title><style>*{box-sizing:border-box}body{margin:0;background:#0d121b;color:white;font:16px system-ui}.wrap{max-width:900px;margin:auto;padding:16px}h1{color:#f5d77d}p{color:#cad6e6}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{background:#1b2a3d;border:1px solid #4b607a;border-radius:16px;overflow:hidden;text-align:center;cursor:pointer;padding-bottom:10px}.art{height:160px;background-size:cover;background-position:center;display:grid;place-items:center;background-color:#31435c}.art img{width:90%;height:90%;object-fit:contain;filter:drop-shadow(0 4px 5px #0009)}b,small{display:block;padding:4px}small{font-size:11px;color:#f2d98b}.modal{position:fixed;inset:0;background:#000d;display:grid;place-items:center;padding:16px}.modal[hidden]{display:none}.panel{position:relative;width:min(95vw,500px);border:2px solid #e5c46d;background:#1b2a3d;border-radius:18px;overflow:hidden;text-align:center}.panel .art{height:min(65vh,440px)}.panel button{position:absolute;z-index:50;pointer-events:auto;touch-action:manipulation;right:10px;top:10px;padding:10px;background:#24364d;color:white;border:1px solid #aaa;border-radius:10px}.panel b{font-size:23px}.floating-close{position:fixed!important;top:max(18px,env(safe-area-inset-top))!important;right:18px!important;z-index:2147483647!important;display:block!important;background:#f5d77d!important;color:#142032!important;border:2px solid #fff!important;border-radius:14px!important;padding:14px 18px!important;font-size:18px!important;font-weight:700!important;touch-action:manipulation!important;pointer-events:auto!important}@media(max-width:480px){.art{height:120px}}</style></head><body><section class="wrap" id="catalogus"><h2 style="color:#f5d77d">🌍 Pokémon GO – achtergrondencatalogus</h2><p id="catalogStatus">Achtergronden laden…</p><input id="catalogSearch" placeholder="Zoek Pokémon of evenement" aria-label="Zoek achtergronden" style="width:100%;padding:15px;background:#24364d;color:white;border:1px solid #71849b;border-radius:12px;font-size:17px"><div id="catalogGrid" class="grid" style="margin-top:16px"></div><button id="catalogMore" type="button" style="display:none;margin:20px auto;padding:15px 25px;background:#f5d77d;border:0;border-radius:12px;font-weight:bold">⬇ Toon nog 60 combinaties</button><p>Bron: pogo-bg catalogus (Serebii, Dittobase en PokeMiners). De koppelingen zijn onderzoeksvoorbeelden en geen bewijs dat een Pokémon in jouw verzameling deze achtergrond bezit.</p></section><div id="modal" class="modal" hidden><button id="close" class="floating-close" type="button">✕ Sluiten</button><div class="panel"><div id="large"></div></div></div><script>const modal=document.getElementById('modal');document.querySelectorAll('.card').forEach(card=>{function show(){document.getElementById('large').innerHTML=card.innerHTML;modal.style.display="grid";modal.hidden=false}card.addEventListener('click',show);card.addEventListener('keydown',e=>{if(e.key==='Enter')show()})});function sluitVergroting(){modal.style.display='none';modal.hidden=true;document.getElementById('large').replaceChildren()}document.getElementById('close').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();sluitVergroting()});modal.addEventListener('click',e=>{if(e.target===modal)sluitVergroting()});document.addEventListener('keydown',e=>{if(e.key==='Escape')sluitVergroting()});</script><script>(async()=>{const root='https://psoren.github.io/pogo-bg/';const status=document.getElementById('catalogStatus'),grid=document.getElementById('catalogGrid'),more=document.getElementById('catalogMore'),search=document.getElementById('catalogSearch');let all=[],filtered=[],shown=0;try{const res=await fetch(root+'data/data.json');if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();for(const bg of data.backgrounds){for(const id of bg.pokemon||[]){const v=data.variants[id];if(!v||!v.sprite||!bg.image)continue;all.push({name:v.name||id,event:bg.name,art:root+bg.image,sprite:root+v.sprite})}}function render(reset){if(reset){grid.replaceChildren();shown=0}const next=filtered.slice(shown,shown+60);for(const x of next){const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');const art=document.createElement('div');art.className='art';art.style.backgroundImage='url("'+x.art+'")';const img=document.createElement('img');img.src=x.sprite;img.alt=x.name;img.loading='lazy';art.append(img);const b=document.createElement('b');b.textContent=x.name;const sm=document.createElement('small');sm.textContent=x.event;card.append(art,b,sm);function show(){document.getElementById('large').replaceChildren(card.cloneNode(true));modal.style.display='grid';modal.hidden=false}card.addEventListener('click',show);card.addEventListener('keydown',e=>{if(e.key==='Enter')show()});grid.append(card)}shown+=next.length;more.style.display=shown<filtered.length?'block':'none';status.textContent=filtered.length+' Pokémon-achtergrondcombinaties gevonden · '+shown+' zichtbaar · '+data.backgrounds.length+' achtergronden in de catalogus'}function filter(){const q=search.value.toLocaleLowerCase('nl');filtered=all.filter(x=>(x.name+' '+x.event).toLocaleLowerCase('nl').includes(q));render(true)}search.addEventListener('input',filter);more.addEventListener('click',()=>render(false));filter()}catch(e){status.textContent='De externe catalogus kon niet geladen worden. Probeer de pagina opnieuw te laden.'}})();</script></body></html>
