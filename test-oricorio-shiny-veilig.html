<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokédex GO – Shiny Oricorio test</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1522;color:#f5f5f5;font:16px system-ui;padding:18px}h1{font-size:24px;color:#f7d577}p{line-height:1.5}.notice{padding:12px;background:#273d55;border-radius:12px;color:#f9d780}.filters{display:flex;gap:8px;margin:20px 0}button{cursor:pointer;color:white;background:#365b7c;border:1px solid #6988a7;border-radius:12px;padding:10px}button.active{background:#795d2b;border-color:#e7c36a}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.card{min-width:0;text-align:center;border:2px solid #e3b957;border-radius:15px;background:linear-gradient(150deg,#54401f,#2c261e);padding:7px 3px;display:flex;flex-direction:column;align-items:center;min-height:225px}.card img{width:100%;height:108px;object-fit:contain}.card strong{font-size:12px;min-height:48px}.num{color:#f7d577;font-size:12px}.counter{margin-top:auto;display:flex;align-items:center;justify-content:space-around;width:100%;gap:2px}.counter button{padding:8px;font-size:17px;background:#86652d;border-color:#cfa54d}.counter span{font-weight:700}footer{margin-top:24px;color:#f5d58c}a{color:#a6d6ff}</style></head><body><h1>✨ Shiny Oricorio – testversie</h1><div class="notice">Alleen testen. Je definitieve Pokédex en de bestaande aantallen blijven ongewijzigd.</div><p>Controleer de vier shiny-afbeeldingen, de gouden kaartjes en de tellers.</p><div class="filters"><button id="shiny" class="active">✨ Shiny</button><button id="normal">Gewoon</button></div><div class="grid" id="grid"></div><footer>TESTVERSIE – nog niet definitief</footer><script>const names=[["Baile","oricorio"],["Pa'u","oricorio-pau"],["Pom-Pom","oricorio-pompom"],["Sensu","oricorio-sensu"]];let mode="shiny";let counts={};try{counts=JSON.parse(localStorage.getItem("pokedexgo_oricorio_isolated_test_v1")||"{}")}catch(e){}function render(){document.querySelectorAll(".filters button").forEach(b=>b.classList.toggle("active",b.id===mode));document.getElementById("grid").innerHTML=names.map(([name,slug])=>{let key=mode+"-"+slug,n=counts[key]||0;return '<article class="card"><div class="num">#741 '+(mode==="shiny"?"✨":"")+'</div><img src="https://play.pokemonshowdown.com/sprites/home'+(mode==="shiny"?"-shiny":"")+'/'+slug+'.png" alt="Oricorio '+name+'"><strong>Oricorio '+name+'</strong><div class="counter"><button data-key="'+key+'" data-step="-1">−</button><span>'+n+'</span><button data-key="'+key+'" data-step="1">+</button></div></article>'}).join("")}document.querySelectorAll(".filters button").forEach(b=>b.onclick=()=>{mode=b.id;render()});document.getElementById("grid").onclick=e=>{const b=e.target.closest("button[data-key]");if(!b)return;counts[b.dataset.key]=Math.max(0,(counts[b.dataset.key]||0)+Number(b.dataset.step));localStorage.setItem("pokedexgo_oricorio_isolated_test_v1",JSON.stringify(counts));render()};render();</script></body></html>
