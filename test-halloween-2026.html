<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokedex Go – Halloween 2026 test</title><style>body{margin:0;background:#0d121b;color:#f5f7fb;font:16px system-ui}header{background:#172231;padding:22px}main{max-width:850px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}article{border:1px solid #40516b;background:#192635;border-radius:14px;padding:14px;text-align:center}h2{font-size:16px}small{color:#bac8d5}.placeholder{height:110px;display:grid;place-content:center;background:#263449;border-radius:12px;color:#f3c96a}a{color:#8fdbff}button{background:#26704b;color:white;border:0;border-radius:8px;padding:9px}p{line-height:1.5}</style></head><body><header><h1>Pokédex Go – Halloween 2026</h1><small>Afzonderlijke testversie · de bestaande app blijft ongewijzigd</small></header><main><p>Vier Halloween-kostuums, elk met een normale en shiny-variant. De exacte kostuumafbeeldingen zijn nog niet geverifieerd; daarom tonen we geen onjuiste gewone Pokémon-afbeeldingen.</p><div class="grid" id="cards"></div><p><a href="./">Terug naar Pokédex Go</a></p></main><script>const pokemon=[[25,'Pikachu','Hoed en capelet'],[41,'Zubat','Hoge hoed'],[42,'Golbat','Hoge hoed'],[169,'Crobat','Hoge hoed']];const box=document.getElementById('cards');for(const [dex,name,costume] of pokemon){const card=document.createElement('article');card.innerHTML='<small>#'+String(dex).padStart(3,'0')+'</small><h2>'+name+'</h2><small>'+costume+'</small><div class="placeholder">🎃<br>Afbeelding volgt</div><p>Normaal + ✨ Shiny</p><small>Halloween 2026</small>';box.append(card)}</script></body></html>
